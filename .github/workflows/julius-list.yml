name: Publish Julius Downloads

on:
  push:
    branches: [main]
    paths:
      - "julius/**"
      - ".github/workflows/julius-list.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Pages artifact
        run: |
          set -euo pipefail

          mkdir -p _site/julius
          maps_file="$(mktemp)"
          trap 'rm -f "$maps_file"' EXIT

          find julius -maxdepth 1 -type f -name "*.map" | sed 's|.*/||' | LC_ALL=C sort > "$maps_file"

          while read -r name; do
            sha=$(sha256sum "julius/$name" | awk '{print $1}')
            echo "$name $sha"
          done < "$maps_file" > _site/julius.list

          cp -a julius/. _site/julius/
          touch _site/.nojekyll

          cat <<'EOF' > _site/index.html
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>c3-maps Julius Downloads</title>
          </head>
          <body>
            <h1>c3-maps Julius Downloads</h1>
            <p><a href="./julius.list">下载 julius.list</a></p>
            <h2>julius/</h2>
            <ul>
          EOF

          while read -r name; do
            printf '      <li><a href="./julius/%s">%s</a></li>\n' "$name" "$name" >> _site/index.html
          done < "$maps_file"

          cat <<'EOF' >> _site/index.html
            </ul>
          </body>
          </html>
          EOF

      - name: Validate Pages artifact
        run: |
          set -euo pipefail

          test -s _site/julius.list
          test -f _site/index.html
          test -d _site/julius
          find _site/julius -maxdepth 1 -type f -name "*.map" | grep -q .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
