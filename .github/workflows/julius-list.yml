name: Publish Julius List

on:
  push:
    branches: [main]
    paths:
      - "julius/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate julius.list
        run: |
          cd julius
          find . -maxdepth 1 -name "*.map" | sort | while read f; do
            name="${f#./}"
            sha=$(sha256sum "$f" | awk '{print $1}')
            echo "$name $sha"
          done > ../julius.list

      - name: Commit julius.list if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet julius.list 2>/dev/null || ! git ls-files --error-unmatch julius.list 2>/dev/null; then
            git add julius.list
            git commit -m "chore: update julius.list [skip ci]"
            git push
          fi

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp julius.list _site/julius.list

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
